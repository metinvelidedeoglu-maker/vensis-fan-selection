font-size:12px;font-weight:700}.catalog-pdf{display:inline-flex;margin-top:18px;padding:10px 14px;border-radius:8px;background:#087f4f;color:#fff;text-decoration:none;font-weight:700}.series-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.detail-section{border:1px solid #d8e3e5;border-radius:12px;padding:16px;background:#fbfdfd}.detail-section h3{margin:0 0 12px;border-bottom:3px solid #087f4f;padding-bottom:8px}.detail-section ul{margin:0;padding-left:20px;line-height:1.55}.models-section{margin-top:28px}.models-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:15px}.model-card{border:1px solid #d8e3e5;border-radius:13px;background:#fff;padding:15px}.model-card-head{display:flex;align-items:center;gap:14px;padding-bottom:13px;border-bottom:1px solid #e3eaeb}.model-card-head img{width:78px;height:78px;object-fit:contain;background:#f7faf9;border-radius:9px;padding:6px}.model-card h3{margin:3px 0 0;font-size:18px}.model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.model-field{background:#f4f8f8;border-radius:8px;padding:8px;min-width:0}.model-field span{display:block;color:#64748b;font-size:10px}.model-field b{display:block;font-size:12px;margin-top:2px;overflow-wrap:anywhere}.model-datasheet-btn{width:100%;margin-top:13px;border:0;border-radius:8px;padding:10px 12px;background:#087f4f;color:#fff;font-weight:800;cursor:pointer}.model-operating-points{margin-top:13px;border:1px solid #d8e3e5;border-radius:9px;overflow:hidden}.model-operating-title{padding:8px 10px;background:#edf6f1;color:#087f4f;font-size:10px;font-weight:900;text-transform:uppercase}.model-operating-scroll{overflow-x:auto}.model-operating-points table{width:100%;border-collapse:collapse;font-size:10px}.model-operating-points th,.model-operating-points td{padding:6px 7px;text-align:right;border-top:1px solid #e3eaeb;white-space:nowrap}.model-operating-points th:first-child,.model-operating-points td:f <body class="app-shell app-catalog">
<header class="catalog-top"><div class="catalog-brand"><img src="assets/vensis-logo.png" alt="Vensis"><div><b>Vensis Engineering Suite</b><div style="font-size:12px;color:#64748b">Product Catalog <span id="brandChip" class="brand-chip"></span></div></div></div><nav class="catalog-nav"><a href="fan-selection.html">⌕ Fan Selection</a><a id="brandBack" class="active" href="catalog-ventilation.html">▦ Product Catalog</a><a href="projects.html">▣ Projects <span data-project-count hidden>0</span></a></nav></header>
<div id="catalogLayout" class="catalog-layout"><aside class="catalog-filter"><h2>Filters</h2><div class="filter-group"><label>Category</label><div id="catalogCategories" class="check-list"></div></div><div class="filter-actions"><button type="button" onclick="Catalog.reset()">Reset Filters</button></div></aside><main class="catalog-content"><div class="catalog-head"><h1>Series</h1><div id="catalogCount" class="catalog-count"></div></div><div id="catalogGrid" class="catalog-grid"></div></main></div>
<main id="detailPage" class="detail-page" hidden></main>
<script>
window.models=[];
(function(){
  const params=new URLSearchParams(location.search);
  const raw=(params.get('brand')||'vitlo').toLowerCase();
  const brand=['vitlo','vortice','sp'].includes(raw)?raw:'vitlo';
  window.VensisCatalogBrand=brand;
  const labels={vitlo:'Vitlo',vortice:'Vortice',sp:'Soler & Palau'};
  document.getElementById('brandChip').textContent=labels[brand];
  const backParams=new URLSearchParams(params);backParams.delete('series');backParams.delete('brand');
  document.getElementById('brandBack').href='catalog-ventilation.html'+(backParams.toString()?'?'+backParams.toString():'');
  const groups={
    vitlo:['data/fans-01.js?v=20260827-axf-name-r2','data/fans-02.js?v=20260811-vitlo-catalog-r1','data/fans-03.js?v=20260811-vitlo-catalog-r1','data/fans-04.js?v=20260811-vitlo-catalog-r1','data/fans-05.js?v=20260811-vitlo-catalog-r1','data/fans-06.js?v=20260811-vitlo-catalog-r1','data/fans-07.js?v=20260811-vitlo-catalog-r1','data/fans-08.js?v=20260812-axw-atex-2t','data/fans-15.js?v=20260824-crs-price-r4'],
    vortice:['data/fans-09.js?v=20260814-vortice-images','data/fans-10.js?v=20260813-ca-md','data/fans-11.js?v=20260813-vortice-batch','data/fans-12.js?v=20260814-vortice-images','data/fans-13.js?v=20260814-vortice-images','data/fans-14.js?v=20260813-vortice-batch','data/vortice-prices-2026-1.js?v=20260814-vortice-prices'],
    sp:['data/soler-palau-catalog.js?v=20260827-sp-images-r7','data/soler-palau-catalog-2.js?v=20260827-sp-images-r7','data/soler-palau-catalog-3.js?v=20260827-sp-images-r7']
  };
  const write=src=>document.write('<scr'+'ipt src="'+src+'"></scr'+'ipt>');
  groups[brand].forEach(write);
  write('data/series-overrides.js?v=20260824-crs-dual-r1');
  write('js/catalog-performance-guard.js?v=20260831-brand-r2');
  write('products/registry.js?v=20260827-sp-images-r7');
  if(brand==='vitlo')write('data/crs-atex-prices-r4.js?v=20260824-r4');
  write('data/catalog-schema-v2.js?v=20260827-vitlo-altmodel-r1');
  if(brand==='vortice'){
    ['01','02','03','04','05'].forEach(n=>write('data/vortice-workbook-2026-2-'+n+'.js?v=20260827-vortice-workbook-r2'));
    write('data/vortice-workbook-2026-2.js?v=20260827-vortice-workbook-r2');
    write('data/vortice-priced-only-policy.js?v=20260827-vortice-priced-only-r1');
  }
  if(brand==='sp'){
    ['01','02','03','04'].forEach(n=>write('data/sp-workbook-2026-2-'+n+'.js?v=20260827-sp-workbook-r1'));
    write('data/sp-workbook-2026-2.js?v=20260827-sp-workbook-r1');
  }
  write('data/no-current-policy.js?v=20260827-no-current-r1');
  write('data/read-only-ui-policy.js?v=20260827-readonly-pdf-r2');
})();
</script>
