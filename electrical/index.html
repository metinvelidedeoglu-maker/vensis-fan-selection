<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vensis Electrical Selection</title><style>body{font-family:Arial;margin:0;background:#f4f7f5;color:#17342b}.top{background:#006a3c;color:#fff;padding:16px}.bar,.page{max-width:1400px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.bar img{height:42px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:#17342b;text-decoration:none;background:#fff;padding:8px 10px;border-radius:8px;font-weight:700}.page{padding:18px}.card{background:#fff;border:1px solid #dfe7e2;border-radius:10px;margin-bottom:14px;padding:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:12px;font-weight:700}select{width:100%;padding:10px;margin-top:6px;border:1px solid #c8d7ce;border-radius:7px}.actions{display:flex;gap:8px;justify-content:flex-end}.actions button{padding:10px 16px;border:0;border-radius:8px;font-weight:800}.primary{background:#006a3c;color:#fff}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:10px;border-bottom:1px solid #e2e8e4;text-align:left}th{background:#eef7f2}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="bar"><div style="display:flex;align-items:center;gap:12px"><img src="../assets/vensis-logo.png"><div><b>Vensis Engineering Suite</b><div>Electrical Selection</div></div></div><nav class="nav"><a href="../index.html">Fan Selection</a><a href="index.html">Electrical Selection</a><a href="../catalog.html">Product Catalog</a><a href="../projects.html">Projects</a><a href="../customers.html">Müşteriler</a></nav></div></header><main class="page"><section class="card"><h3>1. Ürün Grubu</h3><div class="grid"><label>Kategori<select id="category"></select></label><label>Alt Kategori<select id="subcategory"><option value="">Tümü</option></select></label></div></section><section class="card"><h3>2. Filtreler</h3><div class="grid" id="filters"></div></section><div class="actions"><button id="reset">Temizle</button><button id="show" class="primary">Ürünleri Göster</button></div><section class="card"><h3>3. Uygun Ürünler <span id="count"></span></h3><div class="table"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section></main><script>const P=[{category:'Aydınlatma',subcategory:'Exproof Armatür',brand:'DEMO',model:'EXL-60',ip:'IP66',atex:'Zone 1/2/21/22',power:'60 W',cct:'4000 K',mount:'Tavan'},{category:'Aydınlatma',subcategory:'Endüstriyel Armatür',brand:'DEMO',model:'IND-100',ip:'IP65',atex:'ATEX Yok',power:'100 W',cct:'4000 K',mount:'Sarkıt'},{category:'Pano',subcategory:'Exproof Pano',brand:'DEMO',model:'EJB-3020',ip:'IP66',atex:'Zone 1/2',material:'Alüminyum',size:'300x200x180 mm',entries:'4'},{category:'Fiş-Priz',subcategory:'Exproof Fiş-Priz',brand:'DEMO',model:'SP-16-3P',ip:'IP66',atex:'Zone 1/2/21/22',current:'16 A',poles:'3P+E',voltage:'230 V'},{category:'Rakor',subcategory:'Exproof Kablo Rakoru',brand:'DEMO',model:'M25-NI',ip:'IP68',atex:'Zone 1/2/21/22',thread:'M25',material:'Nikel Kaplı Pirinç',cable:'11-17 mm'},{category:'Buat',subcategory:'Exproof Buat',brand:'DEMO',model:'JBOX-4',ip:'IP66',atex:'Zone 1/2/21/22',material:'Alüminyum',size:'120x120x80 mm',entries:'4'},{category:'Kumanda',subcategory:'Exproof Kumanda Kutusu',brand:'DEMO',model:'CTRL-2',ip:'IP66',atex:'Zone 1/2/21/22',material:'Alüminyum',control:'Start/Stop'}];const K={'Aydınlatma':['brand','ip','atex','power','cct','mount'],'Pano':['brand','ip','atex','material','size','entries'],'Fiş-Priz':['brand','ip','atex','current','poles','voltage'],'Rakor':['brand','ip','atex','thread','material','cable'],'Buat':['brand','ip','atex','material','size','entries'],'Kumanda':['brand','ip','atex','material','control']};const L={brand:'Marka',model:'Model',ip:'IP',atex:'ATEX/Zone',power:'Güç',cct:'CCT',mount:'Montaj',material:'Malzeme',size:'Ölçü',entries:'Giriş',current:'Akım',poles:'Kutup',voltage:'Gerilim',thread:'Diş',cable:'Kablo',control:'Kumanda'};const $=x=>document.getElementById(x),u=a=>[...new Set(a.filter(Boolean))].sort();function subs(){let c=$('category').value;$('subcategory').innerHTML='<option value="">Tümü</option>'+u(P.filter(x=>x.category===c).map(x=>x.subcategory)).map(x=>`<option>${x}</option>`).join('');build()}function base(){let c=$('category').value,s=$('subcategory').value;return P.filter(x=>x.category===c&&(!s||x.subcategory===s))}function build(){let c=$('category').value,b=base();$('filters').innerHTML=(K[c]||[]).map(k=>`<label>${L[k]||k}<select data-k="${k}"><option value="">Tümü</option>${u(b.map(x=>x[k])).map(v=>`<option>${v}</option>`).join('')}</select></label>`).join('');render()}function render(){let r=base();document.querySelectorAll('#filters select').forEach(s=>{if(s.value)r=r.filter(x=>String(x[s.dataset.k])===s.value)});let c=$('category').value,ks=['brand','model',...(K[c]||[])].filter((v,i,a)=>a.indexOf(v)===i);$('head').innerHTML='<tr>'+ks.map(k=>`<th>${L[k]||k}</th>`).join('')+'</tr>';$('body').innerHTML=r.map(x=>'<tr>'+ks.map(k=>`<td>${x[k]||'-'}</td>`).join('')+'</tr>').join('');$('count').textContent=`(${r.length})`} $('category').innerHTML=u(P.map(x=>x.category)).map(x=>`<option>${x}</option>`).join('');$('category').onchange=subs;$('subcategory').onchange=build;$('filters').onchange=render;$('show').onclick=render;$('reset').onclick=()=>subs();subs();</script></body></html>
