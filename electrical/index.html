<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vensis Electrical Catalog</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f4;color:#173033}.electrical-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;padding:92px 18px 18px}.electrical-filter,.electrical-content{background:#fff;border:1px solid #d8e3e5;border-radius:14px}.electrical-filter{padding:18px;height:max-content;position:sticky;top:86px}.electrical-filter h2,.electrical-content h1{margin:0 0 16px}.filter-group{margin-bottom:18px}.filter-group label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#52666b}.check-list{max-height:240px;overflow:auto;border:1px solid #d8e3e5;border-radius:9px;padding:7px}.check-row{display:flex;align-items:center;gap:8px;padding:7px 5px;font-size:13px;cursor:pointer}.check-row input{accent-color:#087f4f}.filter-actions button,.back-btn{width:100%;border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;background:#e8eff0;color:#29484d}.electrical-content{padding:20px}.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.catalog-head-left{display:flex;align-items:center;gap:10px}.catalog-head-left .back-btn{width:auto}.catalog-count{color:#64748b;font-size:13px}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.series-card{border:1px solid #d8e3e5;border-radius:14px;background:#fff;overflow:hidden;cursor:pointer;transition:.18s transform,.18s box-shadow,.18s border-color}.series-card:hover,.series-card:focus{transform:translateY(-3px);box-shadow:0 12px 28px rgba(23,48,51,.12);border-color:#087f4f;outline:none}.series-card-image{height:210px;background:linear-gradient(180deg,#f9fbfb,#eef5f3);display:flex;align-items:center;justify-content:center}.series-card-image img{width:100%;height:100%;object-fit:contain;padding:20px}.no-image{font-size:42px;color:#9ab2aa}.series-card-body{padding:16px}.series-brand{font-size:12px;color:#087f4f;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.series-card h2{margin:5px 0 4px;font-size:22px}.series-title{color:#52666b;min-height:38px;font-size:13px}.tech-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}.tech{background:#f4f8f8;border-radius:8px;padding:8px;min-width:0}.tech span{display:block;color:#64748b;font-size:10px}.tech b{display:block;font-size:12px;margin-top:2px;overflow-wrap:anywhere}.series-card-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px;padding-top:13px;border-top:1px solid #e3eaeb;font-size:13px}.series-card-footer span{color:#087f4f;font-weight:700}.empty-state{padding:30px;color:#64748b;text-align:center;grid-column:1/-1}.hidden{display:none!important}@media(max-width:950px){.electrical-layout{grid-template-columns:1fr}.electrical-filter{position:static}}@media(max-width:620px){.electrical-layout{padding:110px 10px 10px;gap:12px}.electrical-filter,.electrical-content{padding:14px}.catalog-grid{grid-template-columns:1fr}.tech-grid{grid-template-columns:repeat(2,1fr)}.check-list{max-height:none}}
</style></head>
<body><div class="electrical-layout"><aside class="electrical-filter"><h2>Filters</h2><div class="filter-group"><label>Brand</label><div id="brands" class="check-list"></div></div><div class="filter-group"><label>Category</label><div id="categories" class="check-list"></div></div><div class="filter-actions"><button id="reset">Reset Filters</button></div></aside><main class="electrical-content"><div class="catalog-head"><div class="catalog-head-left"><button id="back" class="back-btn hidden">← Electrical Catalog</button><h1 id="pageTitle">Electrical Catalog</h1></div><div id="count" class="catalog-count"></div></div><div id="cards" class="catalog-grid"></div></main></div>
<script src="data-zonex.js?v=20260825-r9"></script><script>
const PRODUCTS=window.VENSIS_ELECTRICAL_PRODUCTS||[];const P=PRODUCTS.flatMap(p=>p.submodels.map(s=>({...s,modelName:p.modelName,brand:p.brand,description:p.description,category:p.category,image:p.image,catalogPdf:p.catalogPdf,seriesKey:p.modelName})));const $=x=>document.getElementById(x),u=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let activeSeries='';function checks(id,values,key){$(id).innerHTML=values.map(v=>`<label class="check-row"><input type="checkbox" data-${key}="${esc(v)}"><span>${esc(v)}</span></label>`).join('')}function selected(key){return [...document.querySelectorAll(`[data-${key}]:checked`)].map(x=>x.dataset[key])}function filtered(){const brands=selected('brand'),cats=selected('category');return P.filter(x=>(!brands.length||brands.includes(x.brand))&&(!cats.length||cats.includes(x.category)))}function field(label,value){return value?`<div class="tech"><span>${label}</span><b>${esc(value)}</b></div>`:''}function render(){const r=filtered();if(activeSeries)return renderModels(r.filter(x=>x.seriesKey===activeSeries));const groups=[];const seen=new Set();for(const x of r){if(seen.has(x.seriesKey))continue;seen.add(x.seriesKey);groups.push({x,count:r.filter(y=>y.seriesKey===x.seriesKey).length})}$('pageTitle').textContent='Electrical Catalog';$('back').classList.add('hidden');$('count').textContent=`${groups.length} series`;$('cards').innerHTML=groups.length?groups.map(({x,count})=>`<article class="series-card" tabindex="0" data-series="${esc(x.seriesKey)}"><div class="series-card-image">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.modelName)}">`:'<div class="no-image">⚡</div>'}</div><div class="series-card-body"><div class="series-brand">${esc(x.brand||'ZONEX')}</div><h2>${esc(x.modelName||'')}</h2><div class="series-title">${esc(x.description||x.category||'')}</div><div class="series-card-footer"><span>${esc(x.category||'')}</span><b>${count} submodels</b></div></div></article>`).join(''):'<div class="empty-state">No series match these filters.</div>';document.querySelectorAll('[data-series]').forEach(c=>{const open=()=>{activeSeries=c.dataset.series;render()};c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}function renderModels(r){$('pageTitle').textContent=activeSeries;$('back').classList.remove('hidden');$('count').textContent=`${r.length} submodels`;$('cards').innerHTML=r.length?r.map(x=>`<article class="series-card"><div class="series-card-image">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.model)}">`:'<div class="no-image">⚡</div>'}</div><div class="series-card-body"><div class="series-brand">${esc(x.brand||'ZONEX')}</div><h2>${esc(x.model||x.modelName||'')}</h2><div class="series-title">${esc(x.description||'')}</div><div class="tech-grid">${field('Power',x.power)}${field('Current',x.current)}${field('Voltage',x.voltage)}${field('Frequency',x.frequency)}${field('Phase',x.phase)}${field('IP',x.ip)}${field('Insulation',x.insulation)}${field('Lumen',x.lumen)}${field('Operating Temperature',x.operatingTemperature)}${field('Price',x.price)}</div><div class="series-card-footer"><span>${esc(x.category||'')}</span><b>${esc(x.price||'')}</b></div></div></article>`).join(''):'<div class="empty-state">No submodels found.</div>'}checks('brands',u(P.map(x=>x.brand)),'brand');checks('categories',u(P.map(x=>x.category)),'category');document.querySelectorAll('#brands input,#categories input').forEach(x=>x.onchange=()=>{activeSeries='';render()});$('reset').onclick=()=>{document.querySelectorAll('#brands input,#categories input').forEach(x=>x.checked=false);activeSeries='';render()};$('back').onclick=()=>{activeSeries='';render()};render();
</script><script src="../js/language.js?v=20260825-all-pages-r1"></script><script src="../js/suite-shell.js?v=20260826-header-r1"></script></body></html>
