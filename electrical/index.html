<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vensis Electrical Selection</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f4;color:#173033}.electrical-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;padding:92px 18px 18px}.electrical-filter,.electrical-content{background:#fff;border:1px solid #d8e3e5;border-radius:14px}.electrical-filter{padding:18px;height:max-content;position:sticky;top:86px}.electrical-filter h2,.electrical-content h1{margin:0 0 16px}.filter-group{margin-bottom:18px}.filter-group label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#52666b}.filter-group select{width:100%;padding:10px;border:1px solid #d8e3e5;border-radius:9px;background:#fff;color:#29484d}.filter-grid{display:grid;gap:10px}.filter-actions{display:grid;gap:8px}.filter-actions button,.back-btn{width:100%;border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;background:#e8eff0;color:#29484d}.filter-actions .primary{background:#087f4f;color:#fff}.electrical-content{padding:20px}.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.catalog-head-left{display:flex;align-items:center;gap:10px}.catalog-head-left .back-btn{width:auto}.catalog-count{color:#64748b;font-size:13px}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.series-card{border:1px solid #d8e3e5;border-radius:14px;background:#fff;overflow:hidden;transition:.18s transform,.18s box-shadow,.18s border-color;cursor:pointer}.series-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(23,48,51,.12);border-color:#087f4f}.series-card-image{height:210px;background:linear-gradient(180deg,#f9fbfb,#eef5f3);display:flex;align-items:center;justify-content:center}.series-card-image img{width:100%;height:100%;object-fit:contain;padding:20px}.no-image{font-size:42px;color:#9ab2aa}.series-card-body{padding:16px}.series-brand{font-size:12px;color:#087f4f;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.series-card h2{margin:5px 0 4px;font-size:22px}.series-title{color:#52666b;font-size:13px;min-height:34px}.tech-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:13px}.tech{background:#f4f8f8;border-radius:8px;padding:8px;min-width:0}.tech span{display:block;color:#64748b;font-size:10px}.tech b{display:block;font-size:12px;margin-top:2px;overflow-wrap:anywhere}.series-card-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #e3eaeb;font-size:13px}.series-card-footer span{color:#087f4f;font-weight:700}.empty-state{padding:30px;color:#64748b;text-align:center;grid-column:1/-1}.hidden{display:none!important}@media(max-width:950px){.electrical-layout{grid-template-columns:1fr}.electrical-filter{position:static}}@media(max-width:620px){.electrical-layout{padding:110px 10px 10px;gap:12px}.electrical-filter,.electrical-content{padding:14px}.catalog-grid{grid-template-columns:1fr}.tech-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="electrical-layout"><aside class="electrical-filter"><h2>Filters</h2><div class="filter-group"><label>Kategori</label><select id="category"></select></div><div class="filter-group"><label>Alt Kategori</label><select id="subcategory"><option value="">Tümü</option></select></div><div id="filters" class="filter-grid"></div><div class="filter-actions"><button id="reset">Reset Filters</button><button id="show" class="primary">Ürünleri Göster</button></div></aside><main class="electrical-content"><div class="catalog-head"><div class="catalog-head-left"><button id="back" class="back-btn hidden">← Serilere Dön</button><h1 id="pageTitle">Series</h1></div><div id="count" class="catalog-count"></div></div><div id="cards" class="catalog-grid"></div></main></div>
<script src="data-zonex.js?v=20260825-r7"></script><script>
const PRODUCTS=window.VENSIS_ELECTRICAL_PRODUCTS||[];const P=PRODUCTS.flatMap(p=>p.submodels.map(s=>({...s,modelName:p.modelName,brand:p.brand,description:p.description,category:p.category,image:p.image,catalogPdf:p.catalogPdf,seriesKey:p.modelName})));const FILTERS=['brand','power','current','voltage','frequency','phase','ip','lumen','operatingTemperature'];const L={brand:'Marka',power:'Güç',current:'Akım',voltage:'Voltaj',frequency:'Frekans',phase:'Faz',ip:'IP',insulation:'İzolasyon',lumen:'Lümen',operatingTemperature:'Çalışma Sıcaklığı',price:'Fiyat'};const $=x=>document.getElementById(x),u=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let activeSeries='';function subs(){const c=$('category').value;$('subcategory').innerHTML='<option value="">Tümü</option>'+u(P.filter(x=>x.category===c).map(x=>x.subcategory)).map(x=>`<option>${esc(x)}</option>`).join('');activeSeries='';build()}function base(){const c=$('category').value,s=$('subcategory').value;return P.filter(x=>x.category===c&&(!s||x.subcategory===s))}function build(){const b=base();$('filters').innerHTML=FILTERS.filter(k=>u(b.map(x=>x[k])).length).map(k=>`<div class="filter-group"><label>${L[k]||k}</label><select data-k="${k}"><option value="">Tümü</option>${u(b.map(x=>x[k])).map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`).join('');render()}function filtered(){let r=base();document.querySelectorAll('#filters select').forEach(s=>{if(s.value)r=r.filter(x=>String(x[s.dataset.k])===s.value)});return r}function field(label,value){return value?`<div class="tech"><span>${label}</span><b>${esc(value)}</b></div>`:''}function render(){const r=filtered();if(activeSeries)return renderModels(r.filter(x=>x.seriesKey===activeSeries));const groups=[];const seen=new Set();for(const x of r){if(seen.has(x.seriesKey))continue;seen.add(x.seriesKey);groups.push({x,count:r.filter(y=>y.seriesKey===x.seriesKey).length})}$('pageTitle').textContent='Series';$('back').classList.add('hidden');$('count').textContent=`${groups.length} seri`;$('cards').innerHTML=groups.length?groups.map(({x,count})=>`<article class="series-card" data-series="${esc(x.seriesKey)}"><div class="series-card-image">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.modelName)}">`:'<div class="no-image">⚡</div>'}</div><div class="series-card-body"><div class="series-brand">${esc(x.brand||'ZONEX')}</div><h2>${esc(x.modelName||'')}</h2><div class="series-title">${esc(x.description||x.subcategory||'')}</div><div class="series-card-footer"><span>${esc(x.subcategory||x.category||'')}</span><b>${count} alt model</b></div></div></article>`).join(''):'<div class="empty-state">Bu filtrelerle eşleşen seri bulunamadı.</div>';document.querySelectorAll('[data-series]').forEach(c=>c.onclick=()=>{activeSeries=c.dataset.series;render()})}function renderModels(r){$('pageTitle').textContent=activeSeries;$('back').classList.remove('hidden');$('count').textContent=`${r.length} alt model`;$('cards').innerHTML=r.length?r.map(x=>`<article class="series-card"><div class="series-card-image">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.model)}">`:'<div class="no-image">⚡</div>'}</div><div class="series-card-body"><div class="series-brand">${esc(x.brand||'ZONEX')}</div><h2>${esc(x.model||x.modelName||'')}</h2><div class="series-title">${esc(x.description||'')}</div><div class="tech-grid">${field('Güç',x.power)}${field('Akım',x.current)}${field('Voltaj',x.voltage)}${field('Frekans',x.frequency)}${field('Faz',x.phase)}${field('IP',x.ip)}${field('İzolasyon',x.insulation)}${field('Lümen',x.lumen)}${field('Çalışma Sıcaklığı',x.operatingTemperature)}${field('Fiyat',x.price)}</div><div class="series-card-footer"><span>${esc(x.subcategory||x.category||'')}</span><b>${esc(x.price||'')}</b></div></div></article>`).join(''):'<div class="empty-state">Bu filtrelerle eşleşen alt model bulunamadı.</div>'}$('category').innerHTML=u(P.map(x=>x.category)).map(x=>`<option>${esc(x)}</option>`).join('');$('category').onchange=subs;$('subcategory').onchange=()=>{activeSeries='';build()};$('filters').onchange=()=>{activeSeries='';render()};$('show').onclick=()=>{activeSeries='';render()};$('back').onclick=()=>{activeSeries='';render()};$('reset').onclick=()=>{document.querySelectorAll('#filters select').forEach(s=>s.value='');$('subcategory').value='';activeSeries='';build()};subs();
</script><script src="../js/suite-shell.js?v=20260825-r7"></script></body></html>
