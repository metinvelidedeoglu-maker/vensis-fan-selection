<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vensis Electrical Selection</title><style>body{font-family:Arial;margin:0;background:#f4f7f5;color:#17342b}.page{max-width:1400px;margin:auto;padding:82px 18px 18px}.card{background:#fff;border:1px solid #dfe7e2;border-radius:10px;margin-bottom:14px;padding:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:12px;font-weight:700}select{width:100%;padding:10px;margin-top:6px;border:1px solid #c8d7ce;border-radius:7px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px}.actions button{padding:10px 16px;border:0;border-radius:8px;font-weight:800}.primary{background:#006a3c;color:#fff}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:10px;border-bottom:1px solid #e2e8e4;text-align:left}th{background:#eef7f2}.series{font-weight:800;color:#087f4f}@media(max-width:800px){.grid{grid-template-columns:1fr}.page{padding-top:110px}}</style></head><body><main class="page"><section class="card"><h3>1. Ürün Grubu</h3><div class="grid"><label>Kategori<select id="category"></select></label><label>Alt Kategori<select id="subcategory"><option value="">Tümü</option></select></label></div></section><section class="card"><h3>2. Filtreler</h3><div class="grid" id="filters"></div></section><div class="actions"><button id="reset">Temizle</button><button id="show" class="primary">Ürünleri Göster</button></div><section class="card"><h3>3. Uygun Ürünler <span id="count"></span></h3><div class="table"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section></main><script src="data-zonex.js?v=20260825-r5"></script><script>const PRODUCTS=window.VENSIS_ELECTRICAL_PRODUCTS||[];const P=PRODUCTS.flatMap(p=>p.submodels.map(s=>({...s,modelName:p.modelName,brand:p.brand,description:p.description,category:p.category,image:p.image,catalogPdf:p.catalogPdf})));const STANDARD=['modelName','brand','model','power','current','voltage','frequency','phase','ip','insulation','lumen','operatingTemperature','price'];const FILTERS=['brand','power','current','voltage','frequency','phase','ip','lumen','operatingTemperature'];const L={modelName:'Model Adı',brand:'Marka',model:'Alt Model',power:'Güç',current:'Akım',voltage:'Voltaj',frequency:'Frekans',phase:'Faz',ip:'IP',insulation:'İzolasyon',lumen:'Lümen',operatingTemperature:'Çalışma Sıcaklığı',price:'Fiyat'};const $=x=>document.getElementById(x),u=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'tr'));function subs(){const c=$('category').value;$('subcategory').innerHTML='<option value="">Tümü</option>'+u(P.filter(x=>x.category===c).map(x=>x.subcategory)).map(x=>`<option>${x}</option>`).join('');build()}function base(){const c=$('category').value,s=$('subcategory').value;return P.filter(x=>x.category===c&&(!s||x.subcategory===s))}function build(){const b=base();$('filters').innerHTML=FILTERS.filter(k=>u(b.map(x=>x[k])).length).map(k=>`<label>${L[k]||k}<select data-k="${k}"><option value="">Tümü</option>${u(b.map(x=>x[k])).map(v=>`<option>${v}</option>`).join('')}</select></label>`).join('');render()}function render(){let r=base();document.querySelectorAll('#filters select').forEach(s=>{if(s.value)r=r.filter(x=>String(x[s.dataset.k])===s.value)});$('head').innerHTML='<tr>'+STANDARD.map(k=>`<th>${L[k]||k}</th>`).join('')+'</tr>';$('body').innerHTML=r.map(x=>'<tr>'+STANDARD.map(k=>`<td${k==='modelName'?' class="series"':''}>${x[k]||'-'}</td>`).join('')+'</tr>').join('');$('count').textContent=`(${r.length})`}$('category').innerHTML=u(P.map(x=>x.category)).map(x=>`<option>${x}</option>`).join('');$('category').onchange=subs;$('subcategory').onchange=build;$('filters').onchange=render;$('show').onclick=render;$('reset').onclick=subs;subs();</script><script src="../js/suite-shell.js?v=20260825-r5"></script></body></html>
