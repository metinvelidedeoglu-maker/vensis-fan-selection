<style id="lineo-catalog-styles">
.model-operating-points{margin-top:13px;border:1px solid #d8e3e5;border-radius:9px;overflow:hidden}
.model-operating-title{padding:8px 10px;background:#edf6f1;color:#087f4f;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.model-operating-scroll{overflow-x:auto}
.model-operating-points table{width:100%;border-collapse:collapse;font-size:10px}
.model-operating-points th,.model-operating-points td{padding:6px 7px;text-align:right;border-top:1px solid #e3eaeb;white-space:nowrap}
.model-operating-points th:first-child,.model-operating-points td:first-child{text-align:left}
.model-operating-points th{color:#52666b;background:#f8fbfa;font-size:9px}
.model-dimension{margin-top:13px;border:1px solid #d8e3e5;border-radius:9px;background:#f8fbfa;overflow:hidden}
.model-dimension summary{padding:9px 10px;color:#087f4f;font-size:11px;font-weight:900;cursor:pointer}
.model-dimension img{display:block;width:100%;max-height:440px;object-fit:contain;padding:10px;background:#fff;border-top:1px solid #e3eaeb}
</style>

<style id="catalog-mobile-stack-fix">
body.app-catalog .check-row{
  display:flex!important;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:10px!important;
  min-height:44px!important;
  margin:0!important;
  padding:10px 12px!important;
  cursor:pointer;
}
body.app-catalog .check-row+ .check-row{border-top:1px solid #e5ece9}
body.app-catalog .check-row input[type="checkbox"]{
  width:20px!important;
  height:20px!important;
  min-width:20px!important;
  max-width:20px!important;
  flex:0 0 20px!important;
  margin:0!important;
  padding:0!important;
  border-radius:4px!important;
  box-shadow:none!important;
  accent-color:#087f4f;
}
body.app-catalog .check-row span{display:block;min-width:0;flex:1;line-height:1.25}
@media(max-width:1000px){
  body.app-catalog .catalog-layout{display:grid!important;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto auto!important;width:100%!important;}
  body.app-catalog .catalog-filter{grid-column:1!important;grid-row:1!important;position:static!important;top:auto!important;width:100%!important;min-width:0!important;}
  body.app-catalog .catalog-content{grid-column:1!important;grid-row:2!important;width:100%!important;min-width:0!important;}
}
@media(max-width:620px){
  body.app-catalog .catalog-layout{padding:10px!important;gap:12px!important;}
  body.app-catalog .catalog-filter,body.app-catalog .catalog-content{width:100%!important;max-width:100%!important;}
  body.app-catalog .catalog-filter{padding:16px!important;}
  body.app-catalog .filter-group{margin-bottom:16px!important;}
  body.app-catalog .check-list{max-height:none!important;overflow:visible!important;padding:4px!important;}
  body.app-catalog .check-row{min-height:42px!important;padding:9px 10px!important;}
}
</style>
<style id='ventilation-catalog-search-and-features'>
.catalog-search{margin:0 0 18px;display:flex;flex-direction:column;gap:6px}
.catalog-search label{font-size:13px;font-weight:800;color:#29484d;margin:0}
.catalog-search input{width:100%;min-height:46px;padding:11px 14px;border:1px solid #9cbab0;border-radius:10px;background:#fff;font-size:15px;outline-offset:3px}

.catalog-search-result{display:block;padding:7px 10px;color:#075e39;text-decoration:none;font-weight:700;font-size:12px;border-radius:7px;background:#f1f8f4;margin-top:5px;overflow-wrap:anywhere}
.catalog-search-result:hover,.catalog-search-result:focus{background:#e2f2e9;text-decoration:underline}
.catalog-search-result-note{display:block;color:#64748b;font-size:12px;margin-top:6px}
.model-feature-section{margin-top:12px;border:1px solid #d8e3e5;border-radius:9px;padding:10px;background:#fbfdfc}
.model-feature-heading{font-size:11px;color:#52666b;font-weight:800;margin-bottom:7px}
.model-feature-tags{display:flex;flex-wrap:wrap;gap:6px}
.model-feature-tag{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid #c6e1d1;border-radius:999px;background:#eaf6ee;color:#096343;font-size:11px;font-weight:800;overflow-wrap:anywhere}
.model-feature-empty{font-size:12px;color:#758789}
