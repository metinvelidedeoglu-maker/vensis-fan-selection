name: Apply catalog schema v2

on:
  push:
    branches:
      - schema-v2-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-v2-work
          fetch-depth: 0

      - name: Wire schema v2 into application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'index.html',
              'catalog.html',
              'project.html',
              'project-print.html',
              'quotation.html',
          ]

          pre = '<script src="data/catalog-schema-v2-pre.js?v=20260824-schema-v2"></script>'
          post = '<script src="products/catalog-schema-v2.js?v=20260824-schema-v2"></script>'
          ui = '<script src="js/catalog-schema-v2-ui.js?v=20260824-schema-v2"></script>'

          registry_re = re.compile(r'(<script src="products/registry\.js[^\"]*"></script>)')
          price_re = re.compile(r'(<script src="data/crs-atex-prices-r4\.js[^\"]*"></script>)')
          catalog_re = re.compile(r'(<script src="js/catalog\.js[^\"]*"></script>)')

          for filename in targets:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              if 'catalog-schema-v2-pre.js' not in text:
                  text, count = registry_re.subn(pre + '\n' + r'\1', text, count=1)
                  if count != 1:
                      raise SystemExit(f'registry script not found in {filename}')

              if 'products/catalog-schema-v2.js' not in text:
                  if 'data/crs-atex-prices-r4.js' in text:
                      text, count = price_re.subn(r'\1' + '\n' + post, text, count=1)
                  else:
                      text, count = registry_re.subn(r'\1' + '\n' + post, text, count=1)
                  if count != 1:
                      raise SystemExit(f'post schema insertion failed in {filename}')

              if filename == 'catalog.html' and 'catalog-schema-v2-ui.js' not in text:
                  text, count = catalog_re.subn(r'\1' + '\n' + ui, text, count=1)
                  if count != 1:
                      raise SystemExit('catalog UI script insertion failed')

              path.write_text(text, encoding='utf-8')

          Path('CATALOG-SCHEMA-V2.md').write_text('''# Vensis Catalog Schema V2\n\n## Series\n- Model Adı\n- Marka\n- Açıklama: genel bilgiler, genel özellikler, motor açıklaması ve uygulama alanları tek metin altında\n- Kategori\n- Görsel\n- Alt Modeller\n- Katalog PDF: varsa\n\n## Alt Model\n- Alt Model: seri adı dahil tam model adı\n- Motor Gücü\n- Devir\n- Akım\n- Voltaj\n- Frekans\n- Faz\n- Kutup\n- Maks. Debi\n- Ses\n- IP\n- İzolasyon\n- Performans Eğrisi\n- Fiyat\n- Para Birimi\n\nÜrün Kodu standart şemadan kaldırılmıştır. Eksik veriler uydurulmaz; boş bırakılır. Eski ham alanlar uygulama uyumluluğu için kaynak dosyalarda korunabilir.\n''', encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check data/catalog-schema-v2-pre.js
          node --check products/catalog-schema-v2.js
          node --check js/catalog-schema-v2-ui.js

      - name: Validate normalized catalog
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          global.window = global;
          window.models = [];
          const run = file => vm.runInThisContext(fs.readFileSync(file,'utf8'), {filename:file});
          const fans = fs.readdirSync('data').filter(name => /^fans-\d+\.js$/.test(name)).sort();
          fans.forEach(name => run('data/' + name));
          run('data/series-overrides.js');
          run('data/vortice-prices-2026-1.js');
          run('data/catalog-schema-v2-pre.js');
          run('products/registry.js');
          if(fs.existsSync('data/crs-atex-prices-r4.js')) run('data/crs-atex-prices-r4.js');
          run('products/catalog-schema-v2.js');

          assert.strictEqual(window.VensisCatalog.schemaVersion, '2.0');
          assert.ok(window.VensisCatalog.series.length > 0);
          assert.ok(window.VensisCatalog.models.length > 0);

          for(const series of window.VensisCatalog.series){
            assert.ok(Object.prototype.hasOwnProperty.call(series,'modelName'));
            assert.ok(Object.prototype.hasOwnProperty.call(series,'brand'));
            assert.ok(Object.prototype.hasOwnProperty.call(series,'descriptionText'));
            assert.ok(Array.isArray(series.category));
            assert.ok(Array.isArray(series.submodels));
            assert.ok(Object.prototype.hasOwnProperty.call(series,'catalogPdf'));
          }

          for(const model of window.VensisCatalog.models){
            assert.ok(model.standard, `standard missing: ${model.id}`);
            assert.ok(model.standard.altModel, `alt model missing: ${model.id}`);
            assert.ok(!Object.prototype.hasOwnProperty.call(model.technical || {}, 'productCode'), `productCode remains: ${model.id}`);
          }

          const crs40 = window.VensisCatalog.models.find(m => m.model === 'CRS/ATEX 40-2T-5.5');
          const crs80 = window.VensisCatalog.models.find(m => m.model === 'CRS/ATEX 80-4T-25');
          assert.ok(crs40, 'CRS/ATEX 40 model missing');
          assert.ok(crs80, 'CRS/ATEX 80 model missing');
          assert.strictEqual(crs40.standard.maxAirflow, 9400);
          assert.strictEqual(crs40.standard.price, 4300);
          assert.strictEqual(crs40.standard.phase, 'Trifaze');
          assert.strictEqual(crs40.standard.performanceCurve, 'mevcut');
          assert.strictEqual(crs80.standard.price, 10700);
          console.log(`Validated ${window.VensisCatalog.series.length} series and ${window.VensisCatalog.models.length} submodels.`);
          NODE

      - name: Commit schema v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-schema-v2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Standardize all product series and submodels" || exit 0
          git push origin HEAD:schema-v2-work
