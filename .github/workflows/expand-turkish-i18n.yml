name: Expand Turkish application coverage

on:
  push:
    paths:
      - '.github/workflows/expand-turkish-i18n.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

