name: ChatGPT remove leftover edit buttons
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.event.head_commit.message == 'Remove leftover catalog edit buttons'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove edit buttons from catalog renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/catalog.js')
          text=p.read_text(encoding='utf-8')
          old=text
          text=text.replace('''\n        <button class="vensis-series-edit" type="button" data-edit-series="${esc(series.id)}" title="Edit series information" aria-label="Edit ${esc(series.code||series.title)} series information">✎ Edit Series</button>''','')
          text=text.replace('''\n        <button class="model-datasheet-btn vensis-model-edit" style="margin-top:0;font-size:20px;padding:0;background:#173f46" type="button" data-edit-model="${esc(model.id)}" title="Edit model" aria-label="Edit model">✎</button>''','')
          text=text.replace('grid-template-columns:1fr 48px 48px','grid-template-columns:1fr 48px')
          text=text.replace("card.addEventListener('click',event=>{if(event.target.closest('[data-edit-series]'))return;open()});","card.addEventListener('click',()=>open());")
          text=text.replace("card.addEventListener('keydown',event=>{if(event.target.closest('[data-edit-series]'))return;if(event.key==='Enter'||event.key===' '){event.preventDefault();open()}});","card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open()}});")
          if text==old:
              raise SystemExit('No edit button markup found to remove')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate no edit controls remain
        shell: bash
        run: |
          node --check js/catalog.js
          ! grep -q 'data-edit-series' js/catalog.js
          ! grep -q 'data-edit-model' js/catalog.js
          ! grep -q 'vensis-series-edit' js/catalog.js
          ! grep -q 'vensis-model-edit' js/catalog.js
          ! grep -q 'Edit Series' js/catalog.js
          ! grep -q 'Edit model' js/catalog.js
      - name: Commit button removal
        shell: bash
        run: |
          git config user.name 'Vensis Automation'
          git config user.email 'automation@vensis.local'
          git add js/catalog.js
          git diff --cached --quiet || git commit -m 'Remove catalog edit buttons from renderer'
          git push
