name: ChatGPT catalog preview button
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.event.head_commit.message == 'Switch catalog PDF button to Preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Change catalog action to preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/catalog.js')
          text=p.read_text(encoding='utf-8')
          old='data-model-datasheet="${esc(model.id)}">Save as PDF</button>'
          new='data-model-datasheet="${esc(model.id)}">Preview</button>'
          if old not in text:
              raise SystemExit('Catalog preview button pattern not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          html=Path('catalog.html')
          body=html.read_text(encoding='utf-8')
          body=re.sub(r'js/catalog\.js\?v=[^"]+', 'js/catalog.js?v=20260827-catalog-preview-r1', body)
          html.write_text(body,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          node --check js/catalog.js
          grep -q 'data-model-datasheet=.*>Preview</button>' js/catalog.js
          ! grep -q 'data-model-datasheet=.*>Save as PDF</button>' js/catalog.js
          grep -q 'js/catalog.js?v=20260827-catalog-preview-r1' catalog.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Vensis Automation'
          git config user.email 'automation@vensis.local'
          git add js/catalog.js catalog.html
          git diff --cached --quiet || git commit -m 'Use Preview action in product catalog'
          git push
