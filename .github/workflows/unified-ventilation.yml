name: Unified ventilation checks
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'data/ventilation-catalog.js'
      - 'products/ventilation*.js'
      - 'js/ventilation-routes.js'
      - 'js/catalog.js'
      - 'js/ui/pdf-export.js'
      - 'tests/ventilation*'
      - 'tests/unified-ventilation.test.cjs'
      - '.github/workflows/unified-ventilation.yml'
permissions:
  contents: read
jobs:
  unified-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared registry, routes, data and compatibility checks
        run: node --test tests/sp-dimensions.test.cjs tests/unified-ventilation.test.cjs tests/ventilation-routes.test.cjs tests/clean-fan-slugs.test.cjs tests/fan-sitemap.test.cjs tests/quotation-silent-print.test.cjs tests/vortice-brand-casing.test.cjs tests/private-seo-boundary.test.cjs tests/internal-pages-noindex.test.cjs tests/axw-atex-4m.test.cjs tests/sp-silent-series.test.cjs tests/crvb-crvt-catalogue.test.cjs tests/ctvb-ctvt-catalogue.test.cjs tests/hct-il-catalogue.test.cjs tests/vitlo-model-code.test.cjs tests/vitlo-operating-conditions.test.cjs tests/vortice-catalogue-details.test.cjs tests/confirmed-single-phase.test.cjs tests/sp-four-catalogue-details.test.cjs tests/catalogue-content.test.cjs tests/sp-td-th-details.test.cjs tests/sp-design-details.test.cjs
      - name: Agent snapshot is generated from the same product source
        run: |
          node scripts/build-agent-catalog.mjs
          git diff --exit-code -- api/agent/catalog-v1.json
      - name: PHP syntax and server
        run: |
          php -l sitemap-fans.php
          php -l tests/ventilation-router.php
          php -S 127.0.0.1:8123 tests/ventilation-router.php > /tmp/ventilation-server.log 2>&1 &
      - name: Browser dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Chromium integration and print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/ventilation-browser.mjs
      - name: Catalogue curve status, language switching and mobile cards
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/catalog-curve-status-browser.mjs
      - name: S&P roof-fan curves, mobile cards and print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/sp-roof-curves-browser.mjs
      - name: S&P HCT and IL source curves, mobile and print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/sp-hct-il-curves-browser.mjs
      - name: Vitlo catalogue operating conditions, mobile and print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/vitlo-operating-conditions-browser.mjs
      - name: VORTICE catalogue details, frequency limits, mobile and print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/vortice-catalogue-details-browser.mjs
      - name: Confirmed single-phase families, mobile cards and print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/confirmed-single-phase-browser.mjs
      - name: Four S&P source catalogues, filled cards and ATEX print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/sp-four-catalogue-details-browser.mjs
      - name: Source-matched product features, bilingual copy and representative PDFs
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/catalogue-content-browser.mjs
      - name: TD and TH source technical data, acoustic context and ATEX verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/sp-td-th-details-browser.mjs
      - name: DESIGN source data, retained unknowns and optional variants
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/sp-design-details-browser.mjs
      - name: Complete Soler & Palau drawing and print verification
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/sp-dimensions-browser.mjs
          python3 -m pip install --quiet pypdf
          python3 - <<'PYCODE'
          from pathlib import Path
          from pypdf import PdfReader
          files=list(Path('test-results/sp-dimensions').glob('*.pdf'))
          assert len(files)==163, len(files)
          bad=[(p.name,len(PdfReader(p).pages)) for p in files if len(PdfReader(p).pages)!=1]
          assert not bad, bad
          print('PASS: all 163 Soler & Palau model PDFs have exactly one page.')
          crvb=list(Path('test-results/sp-roof-curves').glob('*.pdf'))
          assert len(crvb)==18, len(crvb)
          assert all(len(PdfReader(p).pages)==1 for p in crvb), 'CRVB/CRVT PDF pagination changed'
          print('PASS: all 18 S&P roof-fan model PDFs have exactly one page.')
          hct_il=list(Path('test-results/sp-hct-il-curves').glob('*.pdf'))
          assert len(hct_il)==22, len(hct_il)
          assert all(len(PdfReader(p).pages)==1 for p in hct_il), 'HCT/IL PDF pagination changed'
          print('PASS: all 22 HCT/IL model PDFs have exactly one page.')
          vitlo=list(Path('test-results/vitlo-operating-conditions').glob('*.pdf'))
          assert len(vitlo)==35, len(vitlo)
          assert all(len(PdfReader(p).pages)==1 for p in vitlo), 'Vitlo PDF pagination changed'
          print('PASS: all 35 Vitlo series PDFs have exactly one page.')
          vortice=list(Path('test-results/vortice-catalogue-details').glob('*.pdf'))
          assert len(vortice)==46, len(vortice)
          assert all(len(PdfReader(p).pages)==1 for p in vortice), 'VORTICE PDF pagination changed'
          print('PASS: all 46 VORTICE catalogue model PDFs have exactly one page.')
          single_phase=list(Path('test-results/confirmed-single-phase').glob('*.pdf'))
          assert len(single_phase)==23, len(single_phase)
          assert all(len(PdfReader(p).pages)==1 for p in single_phase), 'Single-phase family PDF pagination changed'
          print('PASS: all 23 single-phase family PDFs have exactly one page.')
          sp_details=list(Path('test-results/sp-four-catalogue-details').glob('*.pdf'))
          assert len(sp_details)==16, len(sp_details)
          assert all(len(PdfReader(p).pages)==1 for p in sp_details), 'S&P details PDF pagination changed'
          print('PASS: all 16 S&P source-completed PDFs have exactly one page.')
          import json
          content=list(Path('test-results/catalogue-content').glob('*.pdf'))
          expected=json.loads(Path('test-results/catalogue-content/coverage.json').read_text())['pdfs']
          assert len(content)==expected, (len(content), expected)
          assert all(len(PdfReader(p).pages)==1 for p in content), 'Product copy PDF pagination changed'
          print(f'PASS: all {expected} bilingual product-copy PDFs have exactly one page.')
          td_th=list(Path('test-results/sp-td-th-details').glob('*.pdf'))
          assert len(td_th)==20, len(td_th)
          assert all(len(PdfReader(p).pages)==1 for p in td_th), 'TD/TH PDF pagination changed'
          print('PASS: all 20 TD/TH bilingual model PDFs have exactly one page.')
          design=list(Path('test-results/sp-design-details').glob('*.pdf'))
          assert len(design)==12, len(design)
          assert all(len(PdfReader(p).pages)==1 for p in design), 'DESIGN PDF pagination changed'
          print('PASS: all 12 DESIGN bilingual model PDFs have exactly one page.')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ventilation-previews
          path: |
            test-results/ventilation/
            test-results/catalog-curve-status/
            test-results/sp-dimensions/
            test-results/sp-roof-curves/
            test-results/sp-hct-il-curves/
            test-results/vitlo-operating-conditions/
            test-results/vortice-catalogue-details/
            test-results/confirmed-single-phase/
            test-results/sp-four-catalogue-details/
            test-results/catalogue-content/
            test-results/sp-td-th-details/
            test-results/sp-design-details/
          if-no-files-found: ignore
