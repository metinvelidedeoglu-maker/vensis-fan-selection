name: ChatGPT refresh datasheet preview cache
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.event.head_commit.message == 'Refresh datasheet preview cache'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh preview asset version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          version='20260827-preview-r3'
          changed=[]
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              new=re.sub(r'js/ui/pdf-export\.js\?v=[^"]+',f'js/ui/pdf-export.js?v={version}',text)
              if new!=text:
                  p.write_text(new,encoding='utf-8')
                  changed.append(str(p))
          print('UPDATED='+','.join(changed))
          PY
      - name: Validate
        shell: bash
        run: |
          grep -q 'js/ui/pdf-export.js?v=20260827-preview-r3' fan-selection.html
          grep -q 'js/ui/pdf-export.js?v=20260827-preview-r3' catalog.html
          node --check js/ui/pdf-export.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Vensis Automation'
          git config user.email 'automation@vensis.local'
          git add '*.html' '**/*.html' 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Refresh datasheet preview asset version'
          git push
