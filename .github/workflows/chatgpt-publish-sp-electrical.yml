name: ChatGPT publish S&P images and electrical prices
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-publish-sp-electrical.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare versioned assets and cache refresh
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import shutil

          assets = {
              'hctb-hctt.jpg': ('hctb-hctt-20260827.jpg', 'c5c32d1461ebe7195f98b5f521c35fb5fe41f2b66e240ab757105ec368032996'),
              'hxbr-hxtr.jpg': ('hxbr-hxtr-20260827.jpg', 'e57fcc3cd35fe08d3096344339226488c6715ef25763bafdbe80a1e1b45ae669'),
              'th-mixvent.jpg': ('th-mixvent-20260827.jpg', '6d855732302e3c74d505db554029c032a55b18771f8ed47e2345ac28aaaccd2f'),
          }
          asset_dir = Path('assets/products/soler-palau')
          for source_name, (target_name, expected_sha) in assets.items():
              source = asset_dir / source_name
              actual_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Unexpected asset hash for {source}')
              shutil.copyfile(source, asset_dir / target_name)

          replacements = {
              Path('data/soler-palau-catalog-2.js'): {
                  'assets/products/soler-palau/hctb-hctt.jpg': 'assets/products/soler-palau/hctb-hctt-20260827.jpg',
                  'assets/products/soler-palau/hxbr-hxtr.jpg': 'assets/products/soler-palau/hxbr-hxtr-20260827.jpg',
              },
              Path('data/soler-palau-catalog-3.js'): {
                  'assets/products/soler-palau/th-mixvent.jpg': 'assets/products/soler-palau/th-mixvent-20260827.jpg',
              },
              Path('scripts/import-soler-palau.py'): {
                  '"hctb-hctt.jpg"': '"hctb-hctt-20260827.jpg"',
                  '"hxbr-hxtr.jpg"': '"hxbr-hxtr-20260827.jpg"',
                  '"th-mixvent.jpg"': '"th-mixvent-20260827.jpg"',
              },
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs.items():
                  if old not in text and new not in text:
                      raise SystemExit(f'Missing expected reference {old} in {path}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          sp_old = '20260826-soler-palau-r6'
          sp_new = '20260827-sp-images-r7'
          for name in ('catalog.html', 'fan-selection.html', 'project.html', 'project-print.html', 'quotation.html', 'tests/soler-palau-catalog-data.test.cjs'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if sp_old not in text and sp_new not in text:
                  raise SystemExit(f'Missing S&P cache marker in {path}')
              path.write_text(text.replace(sp_old, sp_new), encoding='utf-8')

          electrical_old = '20260827-current-prices-r2'
          electrical_new = '20260827-current-prices-r3'
          for name in ('electrical/index.html', 'tests/electrical-price-list.test.cjs'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if electrical_old not in text and electrical_new not in text:
                  raise SystemExit(f'Missing electrical cache marker in {path}')
              path.write_text(text.replace(electrical_old, electrical_new), encoding='utf-8')

          Path('.github/workflows/chatgpt-publish-sp-electrical.yml').unlink()
      - name: Validate catalog updates
        run: |
          node --test tests/soler-palau-catalog-data.test.cjs tests/electrical-price-list.test.cjs
          node --check electrical/catalog.js
          test -f assets/products/soler-palau/hctb-hctt-20260827.jpg
          test -f assets/products/soler-palau/hxbr-hxtr-20260827.jpg
          test -f assets/products/soler-palau/th-mixvent-20260827.jpg
          ! grep -q "modelField('Order Code'" electrical/catalog.js
      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish S&P images and electrical prices"
          git push
