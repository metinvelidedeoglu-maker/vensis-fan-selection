name: Add CRS ATEX fans
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-crs-atex-suite.yml']
permissions:
  contents: write
jobs:
  add-crs-atex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add CRS ATEX data and catalogue images
        shell: python
        run: |
          import os, json, base64
          os.makedirs('data', exist_ok=True)
          os.makedirs('assets/products/crs-atex', exist_ok=True)

          rect=''''''
          eighty=''''''
          open('assets/products/crs-atex/crs_atex_rectangular.jpg','wb').write(base64.b64decode(rect))
          open('assets/products/crs-atex/crs_atex_80.jpg','wb').write(base64.b64decode(eighty))

          general=[
            'It can be produced up to 50,000 m³/h capacity.',
            'It has radial backward curved blades with maximum efficiency.',
            'The fan casing is produced from hard steel and it is coated electrostatic powder coating as standard.',
            'Suction cone is made of copper material.',
            'It is ex-proof as a complete device.',
            'It is suitable for operation in temperature range -20°C/+80°C.'
          ]
          rows=[
            ('CRS 40-2T-5.5','CRS40-2T-5.5',6000,1610,72,3.20,4.00,2890,7.75,'IP66','100',2,74,{'A':680,'B':800,'C':650,'H':480},'assets/products/crs-atex/crs_atex_rectangular.jpg','CRS ATEX 40-2T-5.5 II 2G EX-db IIC T4(1).pdf','1.2 kg/m³','EXII2G EX-db IIC T4 Gb',[[2000,3600],[1900,4300],[1800,4800],[1700,5500],[1610,6000],[1500,6700],[1300,7600],[1000,8400],[600,9400]]),
            ('CRS 45-2T-10','CRS45-2T-10',13200,1000,72,7.20,7.50,2920,14.00,'IP65','132',2,80,{'A':800,'B':900,'C':650,'H':540},'assets/products/crs-atex/crs_atex_rectangular.jpg','CRS ATEX 45-2T-10.pdf','0.74 kg/m³','EXII2G EEX-D IIC T4',[[2500,5100],[2350,6500],[2200,7800],[2050,9200],[1950,10000],[1700,11000],[1400,12000],[1000,13200],[800,13600]]),
            ('CRS 50-2T-15','CRS50-2T-15',13300,2000,74,10.80,11.00,2930,19.60,'IP65','132',2,80,{'A':850,'B':1000,'C':765,'H':600},'assets/products/crs-atex/crs_atex_rectangular.jpg','CRS ATEX 50-2T-15.pdf','0.89 kg/m³','EXII2G EEX-D IIC T4',[[3500,3600],[3300,5000],[3000,6500],[2800,8000],[2500,10000],[2250,11800],[2000,13300],[1700,14800],[1300,16000],[1000,16600]]),
            ('CRS 56-2T-20','CRS56-2T-20',15000,2160,72,13.80,15.00,2945,26.50,'IP66','160',2,86,{'A':1000,'B':1100,'C':870,'H':650},'assets/products/crs-atex/crs_atex_rectangular.jpg','CRS ATEX 56-2T-20 II 2G EEX-D IIC T4.pdf','1.2 kg/m³','EXII2G EEX-D IIC T4',[[4500,4100],[4300,6500],[4000,8500],[3600,10000],[3200,11500],[2800,13000],[2400,14200],[2160,15000],[1800,16000],[1300,17500],[1000,18500]]),
            ('CRS/ATEX 80-4T-25','CRS80-4T-25',24300,1600,78,16.80,18.50,1475,35.00,'IP66','180',4,86,{'A':450,'B':640,'C':1580,'QD':710,'E':1390,'F':1140},'assets/products/crs-atex/crs_atex_80.jpg','CRS-ATEX 80-4T-25 II 2G EX-db IIC T4 Gb(1).pdf','1.2 kg/m³','II 2G EX-db IIC T4 Gb',[[1600,24300],[1500,26000],[1400,28500],[1300,30500],[1150,32500],[950,34500],[750,36500],[600,38200]])
          ]
          models=[]
          for model,code,nominal,wp,eff,mech,rated,rpm,amps,ip,frame,poles,spl,dims,img,src,density,protection,curve in rows:
            motor=[f'{ip} protected, IE2/IE3 high efficiency and with self lubricating bearing, fully enclosed type, in F insulation class.', 'There are motor options depending on the model and II 2G Eex D/e IIB/IIC T4-T3 protection ratings.', 'It is 400V-50Hz as standard and it is suitable for use with frequency converter.']
            models.append({
              'key':f'VITLO-CRS-ATEX|{code}','configurationId':code,'display':f'{model} ({nominal} m³/h)','model':model,
              'brand':'Vitlo','manufacturer':'Vitlo','family':'CRS/ATEX','series':'CRS/ATEX','productCode':code,
              'fanType':'Radyal','mountType':'Endüstriyel / Kaideli','productGroup':'Exproof Radyal Fan','fanTypeEn':'Centrifugal','mountTypeEn':'Industrial / Base-Mounted','productGroupEn':'Exproof Centrifugal Fan',
              'categories':['Exproof Fan','ATEX Fan','Centrifugal Fan'],'tagsEn':['Exproof Fan','ATEX Fan','Centrifugal Fan'],'catalogNameEn':'CRS/ATEX Ex-proof Centrifugal Fans',
              'nominal':nominal,'maxPressure':max(x[0] for x in curve),'kw':rated,'rpm':rpm,'amps':amps,'spl':spl,'voltage':'400 V','frequency':'50 Hz','weight':0,'ipClass':ip,'insulationClass':'F','phase':'Three Phase','poles':poles,
              'atexProtection':protection,'temperatureRange':'-20°C / +80°C','dimensions':dims,'motorFrameSize':frame,'efficiencyPct':eff,'image':img,
              'sourcePage':1,'sourceCatalogue':src,'airDensity':density,'curveInterpolation':'linear',
              'curveVerification':{'status':'digitized_from_supplied_pdf_chart','sourceCatalogue':src,'sourcePage':1},
              'operatingPoints':[{'control':'nominal','powerW':rated*1000,'powerKw':rated,'currentA':amps,'rpm':rpm,'maxAirflowM3h':nominal,'maxPressurePa':wp,'soundPressureDbA3m':spl,'efficiencyPct':eff,'mechanicalPowerAtWorkingPointKw':mech}],
              'curves':[{'control':'nominal','sourcePage':1,'sourceGraphTitle':'Characteristic Curve','sourceMethod':'digitized approximately from supplied PDF performance graph','interpolation':'linear','precomputed':True,'sourcePoints':curve}],
              'catalogueInfo':{'general':general,'motor':motor,'applications':[]}
            })
          open('data/fans-15.js','w',encoding='utf-8').write('window.models.push(...'+json.dumps(models,ensure_ascii=False,separators=(',',':'))+');\n')

          tag='<script src="data/fans-15.js?v=20260824-crs-atex"></script>'
          for path in ('index.html','catalog.html'):
            s=open(path,encoding='utf-8').read()
            if 'data/fans-15.js' not in s:
              marker='<script src="data/fans-13.js?v=20260814-vortice-images"></script><script src="data/fans-14.js?v=20260813-vortice-batch"></script>'
              s=s.replace(marker, marker+'\n'+tag)
              open(path,'w',encoding='utf-8').write(s)

          os.remove('.github/workflows/add-crs-atex-suite.yml')
      - name: Commit CRS ATEX products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add CRS ATEX centrifugal fan series"
          git push
