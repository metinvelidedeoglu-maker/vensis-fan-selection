name: Bust language cache

on:
  push:
    paths:
      - '.github/workflows/cache-bust-language.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh language-related asset versions
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              'js/project-nav.js?v=20260723-project-cloud': 'js/project-nav.js?v=20260816-language',
              'js/order-utils.js?v=20260813-purchase-order': 'js/order-utils.js?v=20260816-language',
          }

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit cache-bust changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Refresh language asset cache versions"
          git push
