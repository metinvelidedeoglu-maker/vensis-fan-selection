name: UI translation audit

on:
  push:
    paths:
      - '.github/workflows/i18n-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find likely English UI strings
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          include = [*Path('.').glob('*.html'), *Path('js').glob('*.js'), *Path('js/ui').glob('*.js'), *Path('js/core').glob('*.js')]
          exclude = {'js/language.js'}
          words = re.compile(r'\b(the|and|or|to|from|with|for|project|product|fan|selection|quotation|order|print|save|add|remove|edit|view|open|close|no|new|selected|required|price|discount|quantity|total|customer|reference|contact|manufacturer|category|series|model|performance|pressure|flow|airflow|motor|power|speed|current|voltage|frequency|sound|technical|document|datasheet|description|note|status|cloud|browser|sync|search|filter|reset|application|usage|features|information|available|enter|apply|all|custom)\b', re.I)
          string_re = re.compile(r'''(?P<q>['\"`])(?P<s>[^\n]{3,220}?)(?P=q)''')
          seen = set()
          rows = []
          for path in include:
              if str(path) in exclude or not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for m in string_re.finditer(text):
                  s = m.group('s').strip()
                  if not s or '<svg' in s or 'http' in s or 'rgba(' in s or 'display:' in s or 'grid-' in s or '${' in s and len(s) > 170:
                      continue
                  if words.search(s) and re.search(r'[A-Za-z]{3}', s):
                      key=(str(path),s)
                      if key not in seen:
                          seen.add(key); rows.append(key)
          for path,s in rows[:900]:
              print(f'{path}: {s}')
          print(f'\nTOTAL_CANDIDATES={len(rows)}')
          PY
