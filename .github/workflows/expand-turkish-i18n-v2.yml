name: Expand Turkish i18n v2

on:
  push:
    paths:
      - '.github/workflows/expand-turkish-i18n-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply translation expansion
        run: python scripts/expand_i18n.py
      - name: Verify JavaScript
        run: |
          node --check js/language.js
          node --check js/project-nav.js
          node --check js/order-utils.js
          git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/language.js js/project-nav.js js/order-utils.js detail.html project-print.html index.html catalog.html project.html projects.html quotation.html order.html
          git commit -m "Expand Turkish language coverage across app"
          git push
