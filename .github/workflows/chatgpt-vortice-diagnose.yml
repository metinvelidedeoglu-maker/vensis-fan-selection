name: ChatGPT diagnose Vortice workbook
on:
  push:
    branches: [main]
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Vortice workbook matches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print relevant catalog identities
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const html=fs.readFileSync('catalog.html','utf8');
          const srcs=[...html.matchAll(/<script src="([^"]+)"/g)].map(m=>m[1].replace(/\?.*$/,''));
          const end=srcs.indexOf('data/catalog-schema-v2.js');
          const dataScripts=srcs.slice(0,end+1).filter(src=>src.startsWith('data/')||src.startsWith('products/'));
          const noop=()=>{};
          const classList={contains:()=>false,add:noop,remove:noop};
          const document={readyState:'complete',body:{classList},documentElement:{},querySelector:()=>null,querySelectorAll:()=>[],addEventListener:noop,createElement:()=>({classList,style:{},appendChild:noop,setAttribute:noop}),write:noop};
          class MutationObserver{constructor(fn){this.fn=fn}observe(){}disconnect(){}}
          const ctx={console,document,MutationObserver,location:{search:''},URLSearchParams,Intl,Map,Set,Number,String,Array,Object,Math,RegExp,Date,JSON};
          ctx.setInterval=fn=>{try{fn()}catch(e){}return 1};ctx.clearInterval=noop;ctx.setTimeout=fn=>{try{fn()}catch(e){}return 1};ctx.clearTimeout=noop;ctx.window=ctx;ctx.globalThis=ctx;ctx.models=[];
          vm.createContext(ctx);
          for(const src of dataScripts)vm.runInContext(fs.readFileSync(src,'utf8'),ctx,{filename:src});
          const cat=ctx.VensisCatalog;
          const rx=/LINEO|SLIM|QBK|TIRA|E-ATEX/i;
          for(const s of cat.series.filter(s=>String(s.manufacturer).toLowerCase()==='vortice'&&rx.test([s.id,s.code,s.title].join(' ')))){
            console.log('SERIES',JSON.stringify({id:s.id,code:s.code,title:s.title,manufacturer:s.manufacturer}));
            const ms=cat.modelsForSeries?s=>cat.modelsForSeries(s.id):s=>cat.models.filter(m=>m.seriesId===s.id);
            for(const m of ms(s))console.log('MODEL',JSON.stringify({id:m.id,model:m.model,display:m.display,alt:m.standard?.altModel}));
          }
          NODE
