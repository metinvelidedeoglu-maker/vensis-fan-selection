name: ChatGPT remove current from visible app fields
on:
  push:
    branches: [main]
jobs:
  deploy-no-current:
    if: github.event.head_commit.message == 'Remove current from visible app fields'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify policy JavaScript
        run: node --check data/no-current-policy.js
      - name: Load policy on fan application pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          script='<script src="data/no-current-policy.js?v=20260827-no-current-r1"></script>'
          pages=['catalog.html','fan-selection.html','project.html','project-print.html']
          for name in pages:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              text=re.sub(r'\n?<script src="data/no-current-policy\.js\?v=[^"]+"></script>', '', text)
              pattern=r'(<script src="data/catalog-schema-v2\.js\?v=[^"]+"></script>)'
              if not re.search(pattern,text):
                  raise SystemExit(f'catalog schema script not found in {name}')
              text=re.sub(pattern, r'\1\n'+script, text, count=1)
              p.write_text(text,encoding='utf-8')
          PY
          git config user.name 'Vensis Automation'
          git config user.email 'automation@vensis.local'
          git add catalog.html fan-selection.html project.html project-print.html
          git diff --cached --quiet || git commit -m 'Load no-current policy across fan application'
          git push