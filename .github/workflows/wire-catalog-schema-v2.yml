name: Wire catalog schema v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add schema v2 loader to application pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'index.html',
              'catalog.html',
              'project.html',
              'project-print.html',
              'quotation.html',
          ]
          loader = '<script src="data/catalog-schema-v2.js?v=20260824-schema-v2-r1"></script>'
          price_re = re.compile(r'(<script src="data/crs-atex-prices-r4\.js[^\"]*"></script>)')
          registry_re = re.compile(r'(<script src="products/registry\.js[^\"]*"></script>)')

          for filename in targets:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if 'data/catalog-schema-v2.js' in text:
                  continue
              if 'data/crs-atex-prices-r4.js' in text:
                  text, count = price_re.subn(r'\1' + '\n' + loader, text, count=1)
              else:
                  text, count = registry_re.subn(r'\1' + '\n' + loader, text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not wire schema v2 into {filename}')
              path.write_text(text, encoding='utf-8')

          Path('CATALOG-SCHEMA-V2.md').write_text('''# Vensis Catalog Schema V2\n\n## Seri\n- Model Adı\n- Marka\n- Açıklama: genel bilgiler, genel özellikler, motor açıklaması ve uygulama alanları tek başlıkta\n- Kategori\n- Görsel\n- Alt Modeller\n- Katalog PDF: varsa\n\n## Alt Model\n- Alt Model: seri adı dahil tam ad\n- Motor Gücü\n- Devir\n- Akım\n- Voltaj\n- Frekans\n- Faz\n- Kutup\n- Maks. Debi\n- Ses\n- IP\n- İzolasyon\n- Performans Eğrisi\n- Fiyat\n- Para Birimi\n\nÜrün Kodu standart şemadan kaldırılmıştır. Eksik bilgiler uydurulmaz ve boş bırakılır.\n''', encoding='utf-8')
          PY

      - name: Validate schema v2
        run: |
          node --check data/catalog-schema-v2.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          global.window = global;
          window.models = [];
          const run = file => vm.runInThisContext(fs.readFileSync(file,'utf8'), {filename:file});
          fs.readdirSync('data').filter(name => /^fans-\d+\.js$/.test(name)).sort().forEach(name => run('data/'+name));
          run('data/series-overrides.js');
          run('data/vortice-prices-2026-1.js');
          run('products/registry.js');
          if(fs.existsSync('data/crs-atex-prices-r4.js')) run('data/crs-atex-prices-r4.js');
          run('data/catalog-schema-v2.js');

          assert.strictEqual(window.VensisCatalog.schemaVersion,'2.0');
          assert.ok(window.VensisCatalog.series.length > 0);
          assert.ok(window.VensisCatalog.models.length > 0);
          for(const s of window.VensisCatalog.series){
            assert.ok(Object.prototype.hasOwnProperty.call(s,'modelName'));
            assert.ok(Object.prototype.hasOwnProperty.call(s,'brand'));
            assert.ok(Object.prototype.hasOwnProperty.call(s,'descriptionText'));
            assert.ok(Array.isArray(s.category));
            assert.ok(Array.isArray(s.submodels));
            assert.ok(Object.prototype.hasOwnProperty.call(s,'catalogPdf'));
          }
          for(const m of window.VensisCatalog.models){
            assert.ok(m.standard, `standard missing ${m.id}`);
            assert.ok(m.standard.altModel, `alt model missing ${m.id}`);
            assert.ok(!Object.prototype.hasOwnProperty.call(m.technical||{},'productCode'), `productCode remains ${m.id}`);
          }
          const crs40 = window.VensisCatalog.models.find(m => m.model === 'CRS/ATEX 40-2T-5.5');
          const crs80 = window.VensisCatalog.models.find(m => m.model === 'CRS/ATEX 80-4T-25');
          assert.ok(crs40 && crs80,'CRS/ATEX models missing');
          assert.strictEqual(crs40.standard.maxAirflow,9400);
          assert.strictEqual(crs40.standard.price,4300);
          assert.strictEqual(crs40.standard.phase,'Trifaze');
          assert.strictEqual(crs40.standard.performanceCurve,'mevcut');
          assert.strictEqual(crs80.standard.price,10700);
          console.log(`Validated ${window.VensisCatalog.series.length} series / ${window.VensisCatalog.models.length} models`);
          NODE

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/wire-catalog-schema-v2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Standardize all product series and submodels" || exit 0
          git push origin HEAD:main
