name: Build Vitlo technical drawings

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-vitlo-technical-drawings.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install --user pillow

      - name: Download official Vitlo catalogue
        run: |
          curl -L --fail --retry 3 --connect-timeout 15 \
            -A 'Mozilla/5.0 Vensis Engineering Suite' \
            'https://vitlo.com.tr/wp-content/uploads/2025/04/Vitlo-2021-Tr-Eng-Catalog-FZ.pdf' \
            -o /tmp/vitlo.pdf

      - name: Render Vitlo technical drawings per series
        run: |
          mkdir -p /tmp/vitlo-pages assets/products
          for page in 5 6 9 11 15 19 21 23 24 25 31 39 42 47 51 56; do
            pdftoppm -f "$page" -singlefile -png -r 220 /tmp/vitlo.pdf "/tmp/vitlo-pages/page-$page"
          done

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          SERIES = {
              # Every series gets its own file name. Source pages can repeat when
              # Vitlo uses the same technical drawing type for multiple products.
              'AXF': ('AXF', 5),
              'AXD': ('AXD', 5),
              'AXD/ATEX': ('AXD-ATEX', 5),
              'AXB': ('AXB', 5),

              'BOX-AXF': ('BOX-AXF', 11),
              'AXH': ('AXH', 11),

              'AXW': ('AXW', 15),
              'AXW/ATEX': ('AXW-ATEX', 15),

              'AXD/MOB': ('MOB-AXD', 19),
              'MOB-AXD/ATEX': ('MOB-AXD-ATEX', 19),

              'AXR': ('AXR', 21),
              'AXR/ATEX': ('AXR-ATEX', 21),

              'CR': ('CR', 23),
              'CRH': ('CRH', 23),
              'CRH/ATEX': ('CRH-ATEX', 23),
              'CR-EC': ('CR-EC', 23),

              'CRB': ('CRB', 24),
              'CRD': ('CRD', 24),
              'CRD/ATEX': ('CRD-ATEX', 24),
              'CRR': ('CRR', 24),
              'CRB-EC': ('CRB-EC', 24),

              'CRS': ('CRS', 25),
              'CRS/ATEX': ('CRS-ATEX', 25),

              'AXS': ('AXS', 31),

              'CD': ('CD', 39),

              'CRK': ('CRK', 42),
              'CRC': ('CRC', 42),
              'CRC-EC': ('CRC-EC', 42),

              'CRV': ('CRV', 47),
              'CRU': ('CRU', 47),
              'CRU-EC': ('CRU-EC', 47),

              'AXV': ('AXV', 51),

              'VHR': ('VHR', 56),

              'AXJ': ('AXJ', 6),
              'TUNEL-AXF': ('TUNEL-AXF', 9),
          }

          def teal_row_count(image, y):
              w, _ = image.size
              pixels = image.load()
              count = 0
              for x in range(int(w * 0.03), int(w * 0.96), 4):
                  r, g, b = pixels[x, y]
                  if g > 95 and b > 75 and r < 150 and (g - r) > 25 and (b - r) > 15:
                      count += 1
              return count

          def find_dimensions_bar(image):
              w, h = image.size
              threshold = int((w * 0.90 / 4) * 0.30)
              rows = []
              for y in range(int(h * 0.18), int(h * 0.94), 3):
                  if teal_row_count(image, y) >= threshold:
                      rows.append(y)
              if not rows:
                  raise RuntimeError('Dimensions bar not detected')
              groups = []
              start = prev = rows[0]
              for y in rows[1:]:
                  if y - prev > 9:
                      groups.append((start, prev))
                      start = y
                  prev = y
              groups.append((start, prev))
              # The Dimensions banner is the lowest wide teal bar on catalogue data pages.
              return groups[-1]

          def crop_drawing(page):
              image = Image.open(f'/tmp/vitlo-pages/page-{page}.png').convert('RGB')
              w, h = image.size
              _, bar_bottom = find_dimensions_bar(image)

              x0 = int(w * 0.495)
              x1 = int(w * 0.945)
              y0 = min(h - 1, max(0, bar_bottom + 1))
              y1 = int(h * 0.955)
              region = image.crop((x0, y0, x1, y1))

              gray = region.convert('L')
              rw, rh = gray.size
              px = gray.load()

              # Keep dark catalogue line-art and dimension labels, while ignoring the
              # light decorative footer. The technical drawing is the first coherent
              # dark-content block to the right of the dimension table.
              active = []
              for y in range(rh):
                  dark = 0
                  for x in range(0, rw, 2):
                      if px[x, y] < 185:
                          dark += 1
                  if dark >= 6:
                      active.append(y)

              if not active:
                  raise RuntimeError(f'No drawing pixels detected on page {page}')

              groups = []
              start = prev = active[0]
              for y in active[1:]:
                  if y - prev > 45:
                      groups.append((start, prev))
                      start = y
                  prev = y
              groups.append((start, prev))

              # Ignore tiny footer/page-number groups.
              groups = [g for g in groups if g[1] - g[0] >= 35]
              if not groups:
                  raise RuntimeError(f'No technical drawing block detected on page {page}')

              top, bottom = groups[0]
              sub = region.crop((0, max(0, top - 48), rw, min(rh, bottom + 24)))

              # Tight horizontal trim around actual drawing content.
              g = sub.convert('L')
              mask = g.point(lambda p: 0 if p > 238 else 255)
              bbox = mask.getbbox()
              if bbox:
                  left, top2, right, bottom2 = bbox
                  side_pad = 24
                  top_pad = 54
                  bottom_pad = 28
                  left = max(0, left - side_pad)
                  top2 = max(0, top2 - top_pad)
                  right = min(sub.width, right + side_pad)
                  bottom2 = min(sub.height, bottom2 + bottom_pad)
                  sub = sub.crop((left, top2, right, bottom2))

              canvas = Image.new('RGB', (sub.width + 32, sub.height + 32), 'white')
              canvas.paste(sub, (16, 16))
              return canvas

          out = Path('assets/products')
          out.mkdir(parents=True, exist_ok=True)

          built = []
          for series, (base, page) in SERIES.items():
              print(f'Processing {series} page {page}', flush=True)
              drawing = crop_drawing(page)
              target = out / f'{base}-technical-drawing.webp'
              drawing.save(target, 'WEBP', quality=96, method=6)
              built.append((series, target.name, page, drawing.size))

          print('Generated:')
          for row in built:
              print(row)
          PY

      - name: Commit generated assets
        run: |
          git config user.name 'Vensis Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/products/*-technical-drawing.webp
          if git diff --cached --quiet; then
            echo 'Technical drawings already up to date.'
          else
            git commit -m 'Add per-series Vitlo technical drawing WebP assets'
            git pull --rebase origin main
            git push
          fi
