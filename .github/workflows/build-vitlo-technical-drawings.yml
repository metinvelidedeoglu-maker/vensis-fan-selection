name: Build Vitlo technical drawings

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-vitlo-technical-drawings.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install extractor
        run: |
          python3 -m pip install --user pymupdf pillow

      - name: Download official Vitlo catalogue
        run: |
          curl -L --fail --retry 3 --connect-timeout 15 \
            -A 'Mozilla/5.0 Vensis Engineering Suite' \
            'https://vitlo.com.tr/wp-content/uploads/2025/04/Vitlo-2021-Tr-Eng-Catalog-FZ.pdf' \
            -o /tmp/vitlo.pdf

      - name: Extract embedded technical drawings
        run: |
          python3 - <<'PY'
          import io
          from pathlib import Path
          import fitz
          from PIL import Image

          doc = fitz.open('/tmp/vitlo.pdf')
          out = Path('assets/products')
          out.mkdir(parents=True, exist_ok=True)

          # Verified against the catalogue supplied by the user.
          # These are embedded drawing images, not page crops.
          SERIES = {
              'AXF': ('AXF', 5),
              'TUNEL-AXF': ('TUNEL-AXF', 9),
              'BOX-AXF': ('BOX-AXF', 11),
              'AXW/ATEX': ('AXW-ATEX', 15),
              'AXD/ATEX': ('AXD-ATEX', 17),
              'MOB-AXD/ATEX': ('MOB-AXD-ATEX', 19),
              'AXR/ATEX': ('AXR-ATEX', 21),
              'CRH/ATEX': ('CRH-ATEX', 23),
              'CRD/ATEX': ('CRD-ATEX', 24),
              'CRS/ATEX': ('CRS-ATEX', 25),
              'AXD': ('AXD', 27),
              'AXD/MOB': ('MOB-AXD', 29),
              'AXS': ('AXS', 31),
              'AXW': ('AXW', 33),
              'AXB': ('AXB', 35),
              'AXH': ('AXH', 37),
              'CD': ('CD', 38),
              'CRB': ('CRB', 39),
              'CRD': ('CRD', 40),
              'CRK': ('CRK', 41),
              'CRC': ('CRC', 42),
              'CRS': ('CRS', 43),
              'CR': ('CR', 44),
              'CRH': ('CRH', 45),
              # CRV has no separate embedded raster drawing on its catalogue page;
              # Vitlo uses the same vertical roof arrangement represented on CRU.
              'CRV': ('CRV', 47),
              'CRU': ('CRU', 47),
              'AXR': ('AXR', 49),
              'AXV': ('AXV', 51),
              'CR-EC': ('CR-EC', 52),
              'CRU-EC': ('CRU-EC', 53),
              'CRB-EC': ('CRB-EC', 54),
              'CRC-EC': ('CRC-EC', 55),
              'VHR': ('VHR', 56),
              'CRR': ('CRR', 57),
          }

          def embedded_drawing(page_number):
              page = doc[page_number - 1]
              candidates = []
              for info in page.get_image_info(xrefs=True):
                  xref = int(info.get('xref') or 0)
                  if xref <= 0:
                      continue
                  x0, y0, x1, y1 = info['bbox']
                  width = int(info.get('width') or 0)
                  height = int(info.get('height') or 0)

                  # Technical drawings in the supplied Vitlo catalogue are embedded
                  # on the right half of the page. This excludes product photos,
                  # footer artwork and tiny control/interface icons.
                  if x0 < 270:
                      continue
                  if width * height < 25000:
                      continue
                  if y0 > 790 and width > 1500:
                      continue
                  candidates.append((width * height, xref, info))

              if not candidates:
                  raise RuntimeError(
                      f'No embedded technical drawing image found on catalogue page {page_number}'
                  )

              # There is normally one valid right-side embedded image. Prefer the
              # largest pixel image if a page contains more than one.
              _, xref, info = max(candidates, key=lambda row: row[0])
              extracted = doc.extract_image(xref)
              image = Image.open(io.BytesIO(extracted['image'])).convert('RGB')
              return image, xref, info

          generated = []
          cache = {}
          for series, (base, page_number) in SERIES.items():
              # Reuse extraction for identical source pages while still writing a
              # distinct product-named file for every series.
              if page_number not in cache:
                  cache[page_number] = embedded_drawing(page_number)
              image, xref, info = cache[page_number]
              target = out / f'{base}-technical-drawing.webp'
              image.save(target, 'WEBP', lossless=True, method=6)
              generated.append((series, target.name, page_number, xref, image.size))

          print('Embedded Vitlo technical drawings:')
          for row in generated:
              print(row)
          print(f'Generated {len(generated)} product-specific drawing files.')
          print('AXJ is intentionally preserved because its catalogue page has no separate embedded raster drawing.')
          PY

      - name: Commit generated assets
        run: |
          git config user.name 'Vensis Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/products/*-technical-drawing.webp
          if git diff --cached --quiet; then
            echo 'Embedded technical drawings already up to date.'
          else
            git commit -m 'Use embedded Vitlo technical drawing images'
            git pull --rebase origin main
            git push
          fi
