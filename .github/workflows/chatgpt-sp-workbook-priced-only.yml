name: ChatGPT apply S&P priced workbook
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply S&P workbook priced-only policy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inject S&P workbook data across app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          version='20260827-sp-workbook-r1'
          tags='\n'.join([
              f'<script src="data/sp-workbook-2026-2-{i:02d}.js?v={version}"></script>' for i in range(1,5)
          ]+[f'<script src="data/sp-workbook-2026-2.js?v={version}"></script>'])
          changed=[]
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              if 'data/catalog-schema-v2.js' not in text:
                  continue
              text=re.sub(r'\n?<script src="data/sp-workbook-2026-2(?:-\d{2})?\.js\?v=[^"]+"></script>', '', text)
              pattern=r'(<script src="data/vortice-priced-only-policy\.js\?v=[^"]+"></script>)'
              if not re.search(pattern,text):
                  raise SystemExit(f'Vortice priced-only anchor not found in {p}')
              updated=re.sub(pattern, r'\1\n'+tags, text, count=1)
              if updated!=text:
                  p.write_text(updated,encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('No HTML page was updated')
          print('UPDATED_HTML=' + ','.join(changed))
          PY
      - name: Validate S&P workbook against catalog
        shell: bash
        run: |
          for file in data/sp-workbook-2026-2-0{1..4}.js data/sp-workbook-2026-2.js; do node --check "$file"; done
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const html=fs.readFileSync('catalog.html','utf8');
          const srcs=[...html.matchAll(/<script src="([^"]+)"/g)].map(m=>m[1].replace(/\?.*$/,''));
          const end=srcs.indexOf('data/sp-workbook-2026-2.js');
          if(end<0)throw new Error('S&P workbook integration script missing from catalog.html');
          const scripts=srcs.slice(0,end+1).filter(src=>src.startsWith('data/')||src.startsWith('products/'));
          const noop=()=>{};
          const classList={contains:()=>false,add:noop,remove:noop};
          const document={readyState:'complete',body:{classList},documentElement:{},querySelector:()=>null,querySelectorAll:()=>[],addEventListener:noop,createElement:()=>({classList,style:{},appendChild:noop,setAttribute:noop}),write:noop};
          class MutationObserver{constructor(fn){this.fn=fn}observe(){}disconnect(){}}
          const ctx={console,document,MutationObserver,location:{search:''},URLSearchParams,Intl,Map,Set,Number,String,Array,Object,Math,RegExp,Date,JSON};
          ctx.setInterval=fn=>{try{fn()}catch(e){}return 1};ctx.clearInterval=noop;ctx.setTimeout=fn=>{try{fn()}catch(e){}return 1};ctx.clearTimeout=noop;ctx.window=ctx;ctx.globalThis=ctx;ctx.models=[];
          vm.createContext(ctx);
          for(const src of scripts)vm.runInContext(fs.readFileSync(src,'utf8'),ctx,{filename:src});
          const cat=ctx.VensisCatalog;
          const report=cat?.solerPalauWorkbook;
          if(!report)throw new Error('S&P workbook report missing');
          const spSeries=new Set(cat.series.filter(s=>String(s.manufacturer||'').trim().toLowerCase()==='soler & palau').map(s=>s.id));
          const models=cat.models.filter(m=>spSeries.has(m.seriesId));
          const noPrice=models.filter(m=>!(Number(m?.pricing?.listPrice)>0));
          console.log(JSON.stringify(report));
          console.log('SP_REMAINING='+models.length);
          console.log('SP_MISSING_PRICE='+noPrice.length);
          if(report.rows!==158||report.applied!==158)throw new Error(`Expected 158 workbook rows applied, got ${report.applied}/${report.rows}`);
          if(report.unmatchedSeries.length)throw new Error('Unmatched S&P series: '+report.unmatchedSeries.join(','));
          if(report.catalogOnlyAliases!==0)throw new Error(`Expected all workbook names to match existing S&P models; aliases=${report.catalogOnlyAliases}`);
          if(models.length!==158)throw new Error(`Expected exactly 158 S&P models remaining, got ${models.length}`);
          if(noPrice.length)throw new Error(`Unpriced S&P models remain: ${noPrice.length}`);
          NODE
      - name: Commit page integration
        shell: bash
        run: |
          git config user.name 'Vensis Automation'
          git config user.email 'automation@vensis.local'
          git add '*.html' '**/*.html' 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Load S&P priced workbook across app'
          git push
